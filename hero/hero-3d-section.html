<!-- ============================================================
     Seawind — Premium 3D Immersive Scroll Hero (markup snippet)
     Paste this in place of the existing <section class="hero">...
     block in index.html. Requires hero-3d.css + hero-3d.js, plus
     the three.js and gsap/ScrollTrigger CDN scripts (see README).
     ============================================================ -->
<section class="hero3d" id="hero3d">
  <canvas class="hero3d-canvas" id="hero3dCanvas" aria-hidden="true"></canvas>
  <div class="hero3d-grid-overlay" aria-hidden="true"></div>

  <div class="hero3d-inner">
    <div class="hero3d-content">
      <span class="hero-badge hero3d-badge">✦ Ahmedabad's #1 Digital Agency</span>

      <h1 class="hero3d-title">
        <span class="hero3d-line"><span class="word">Now</span> <span class="word">is</span> <span class="word">the</span> <span class="word">Time</span></span>
        <span class="hero3d-line hero3d-line-grad"><span class="word">for</span> <span class="word">your</span> <span class="word">Dream</span> <span class="word">Website</span></span>
      </h1>

      <p class="hero3d-sub">Where bold design meets seamless functionality — now with immersive, scroll-driven 3D depth.</p>

      <div class="hero-cta hero3d-cta">
        <button class="btn-primary">LET'S TALK →</button>
        <button class="btn-ghost">PLAN WITH AI ✦</button>
      </div>

      <div class="hero3d-trust">
        <span class="hero3d-trust-dot" aria-hidden="true"></span>
        <span>Trusted by 65+ global brands since 2012</span>
      </div>
    </div>

    <div class="hero3d-stage">
      <div class="hero3d-card hero3d-card-main">
        <div class="hero3d-card-glow" aria-hidden="true"></div>
        <div class="hero3d-browser-dots"><span></span><span></span><span></span></div>
        <div class="hero3d-line-mock"></div>
        <div class="hero3d-line-mock short"></div>
        <div class="hero3d-chart" aria-hidden="true">
          <span style="height:38%"></span>
          <span style="height:62%"></span>
          <span style="height:48%"></span>
          <span style="height:80%"></span>
          <span style="height:66%"></span>
          <span style="height:94%"></span>
        </div>
        <div class="hero3d-line-mock short"></div>
      </div>

      <div class="hero3d-card hero3d-card-float-1">
        <div class="hero3d-stat-num">98%</div>
        <div class="hero3d-stat-label">Client Satisfaction</div>
      </div>

      <div class="hero3d-card hero3d-card-float-2">
        <div class="hero3d-stat-num">13+</div>
        <div class="hero3d-stat-label">Years of Excellence</div>
      </div>
    </div>
  </div>

  <div class="hero3d-scrollcue">
    <span>Scroll to explore</span>
    <div class="hero3d-mouse"><div class="hero3d-wheel"></div></div>
  </div>
</section>
